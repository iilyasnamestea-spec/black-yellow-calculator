<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Black and yellow calculator with responsive design and keyboard support"
    />
    <title>Black Yellow Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="calculator-shell">
      <section class="calculator" aria-label="Calculator">
        <div class="display-panel">
          <div class="display" id="display" aria-live="polite">0</div>
        </div>

        <div class="keypad" aria-label="Calculator keypad">
          <button type="button" class="btn btn-secondary" data-action="clear">AC</button>
          <button type="button" class="btn btn-secondary" data-action="delete">⌫</button>
          <button type="button" class="btn btn-secondary" data-action="sign">±</button>
          <button type="button" class="btn btn-operator" data-action="operator" data-value="/">÷</button>

          <button type="button" class="btn" data-action="number" data-value="7">7</button>
          <button type="button" class="btn" data-action="number" data-value="8">8</button>
          <button type="button" class="btn" data-action="number" data-value="9">9</button>
          <button type="button" class="btn btn-operator" data-action="operator" data-value="*">×</button>

          <button type="button" class="btn" data-action="number" data-value="4">4</button>
          <button type="button" class="btn" data-action="number" data-value="5">5</button>
          <button type="button" class="btn" data-action="number" data-value="6">6</button>
          <button type="button" class="btn btn-operator" data-action="operator" data-value="-">−</button>

          <button type="button" class="btn" data-action="number" data-value="1">1</button>
          <button type="button" class="btn" data-action="number" data-value="2">2</button>
          <button type="button" class="btn" data-action="number" data-value="3">3</button>
          <button type="button" class="btn btn-operator" data-action="operator" data-value="+">+</button>

          <button type="button" class="btn btn-secondary" data-action="percent">%</button>
          <button type="button" class="btn" data-action="number" data-value="0">0</button>
          <button type="button" class="btn" data-action="decimal">.</button>
          <button type="button" class="btn btn-equals" data-action="equals">=</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
